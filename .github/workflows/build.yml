name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: unzip ThunderMace.zip
      - run: mvn -B package
        working-directory: ThunderMace
      - run: ls -R ThunderMace/target
      - uses: actions/upload-artifact@v4
        with:
          name: ThunderMace-jar
          path: ThunderMace/target/*.jar
